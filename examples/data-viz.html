<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Visualization - Push Record Design System</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    /* Design System Page Styles */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--color-2);
      color: var(--color-8);
      font-family: var(--font-sf-pro-text);
      line-height: 1.6;
    }

    /* Layout */
    .ds-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 80px 40px;
    }

    .ds-section {
      margin-bottom: 120px;
    }

    .ds-section-title {
      font-family: var(--font-sf-pro);
      font-size: 14px;
      font-weight: var(--weight-medium);
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--color-7);
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-light);
    }

    .ds-section-description {
      font-size: 18px;
      color: var(--color-6);
      margin-bottom: 48px;
      max-width: 600px;
    }

    /* Grid */
    .ds-grid {
      display: grid;
      gap: 16px;
    }

    .ds-grid--2 { grid-template-columns: repeat(2, 1fr); }
    .ds-grid--3 { grid-template-columns: repeat(3, 1fr); }
    .ds-grid--4 { grid-template-columns: repeat(4, 1fr); }
    .ds-grid--5 { grid-template-columns: repeat(5, 1fr); }

    @media (max-width: 1024px) {
      .ds-grid--4, .ds-grid--5 { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 768px) {
      .ds-grid--2, .ds-grid--3, .ds-grid--4, .ds-grid--5 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Header */
    .ds-header {
      padding: 60px 40px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 80px;
    }

    .ds-header__title {
      font-family: var(--font-sf-pro);
      font-size: 64px;
      font-weight: var(--weight-bold);
      color: var(--color-5);
      letter-spacing: -2px;
      margin-bottom: 16px;
    }

    .ds-header__subtitle {
      font-size: 24px;
      font-weight: var(--weight-light);
      color: var(--color-6);
    }

    /* Navigation */
    .ds-nav {
      position: fixed;
      left: 0;
      top: 0;
      width: 240px;
      height: 100vh;
      background: var(--bg-elevated);
      border-right: 1px solid var(--border-subtle);
      padding: 32px 24px;
      overflow-y: auto;
      z-index: 100;
    }

    .ds-nav__title {
      font-size: 14px;
      font-weight: var(--weight-medium);
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--color-1);
      margin-bottom: 32px;
    }

    .ds-nav__link {
      display: block;
      font-size: 14px;
      color: var(--color-6);
      text-decoration: none;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-subtle);
      transition: color 0.2s;
    }

    .ds-nav__link:hover {
      color: var(--color-7);
    }

    .ds-main {
      margin-left: 240px;
    }

    @media (max-width: 1024px) {
      .ds-nav { display: none; }
      .ds-main { margin-left: 0; }
    }

    /* Color Swatch */
    .ds-swatch {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      overflow: hidden;
    }

    .ds-swatch__color {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ds-swatch__info {
      padding: 10px 12px;
      border-top: 1px solid var(--border-subtle);
    }

    .ds-swatch__name {
      font-size: 11px;
      font-weight: var(--weight-medium);
      color: var(--color-1);
      margin-bottom: 2px;
    }

    .ds-swatch__value {
      font-family: var(--font-sf-mono);
      font-size: 9px;
      color: var(--color-9);
    }

    .ds-swatch__token {
      font-family: var(--font-sf-mono);
      font-size: 9px;
      color: var(--color-7);
      margin-top: 4px;
    }

    /* Typography Specimen */
    .ds-type-specimen {
      padding: 20px 24px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      margin-bottom: 16px;
    }

    .ds-type-specimen__sample {
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .ds-type-specimen__meta {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .ds-type-specimen__label {
      font-size: 9px;
      font-weight: var(--weight-medium);
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--color-9);
      margin-bottom: 2px;
    }

    .ds-type-specimen__value {
      font-family: var(--font-sf-mono);
      font-size: 11px;
      color: var(--color-6);
    }

    /* Spacing */
    .ds-spacing-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    .ds-spacing-bar {
      height: 16px;
      background: var(--color-7);
      border-radius: 2px;
      opacity: 0.6;
    }

    .ds-spacing-label {
      font-family: var(--font-sf-mono);
      font-size: 11px;
      color: var(--color-6);
      min-width: 80px;
    }

    .ds-spacing-value {
      font-family: var(--font-sf-mono);
      font-size: 11px;
      color: var(--color-9);
      min-width: 48px;
    }

    /* Border Demo */
    .ds-border-demo {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: var(--bg-surface);
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .ds-border-sample {
      width: 80px;
      height: 56px;
      background: var(--bg-overlay);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--color-9);
    }

    .ds-border-info {
      flex: 1;
    }

    .ds-border-name {
      font-size: 12px;
      font-weight: var(--weight-medium);
      color: var(--color-1);
      margin-bottom: 4px;
    }

    .ds-border-spec {
      font-family: var(--font-sf-mono);
      font-size: 10px;
      color: var(--color-9);
    }

    /* Effect Demo */
    .ds-effect-demo {
      padding: 24px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      margin-bottom: 12px;
    }

    /* Component Card */
    .ds-component-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      overflow: hidden;
    }

    .ds-component-preview {
      padding: 24px;
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border-subtle);
    }

    .ds-component-info {
      padding: 12px 16px;
    }

    .ds-component-name {
      font-size: 13px;
      font-weight: var(--weight-medium);
      color: var(--color-1);
      margin-bottom: 4px;
    }

    .ds-component-class {
      font-family: var(--font-sf-mono);
      font-size: 10px;
      color: var(--color-7);
    }

    /* Code Block */
    .ds-code {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 24px;
      font-family: var(--font-sf-mono);
      font-size: 13px;
      color: var(--color-6);
      overflow-x: auto;
      white-space: pre;
      margin-top: 24px;
    }

    /* Divider */
    .ds-divider {
      height: 1px;
      background: var(--border-subtle);
      margin: 80px 0;
    }
  </style>
</head>
<body>
  <main class="ds-main" style="margin-left: 0;">
    <header class="ds-header">
      <a href="index.html" style="color: var(--color-7); font-size: 14px; text-decoration: none;">&larr; Back to Examples</a>
      <h1 class="ds-header__title" style="margin-top: 16px;">Data Visualization</h1>
      <p class="ds-header__subtitle">Charts, graphs, and data display components</p>
    </header>
    <div class="ds-container">
      <section class="ds-section" id="data-viz">
        <div class="ds-section-title">Data Visualization</div>
        <p class="ds-section-description">Charts and data display components for analytics and metrics.</p>

        <div class="ds-grid ds-grid--3">

          <!-- Bar Chart -->
          <div class="ds-component-card">
            <div class="ds-component-preview" style="padding: 16px 24px;">
              <div class="bar-chart" style="height: 80px; width: 100%;">
                <div class="bar-chart__bar bar-chart__bar--muted" style="height: 40%;"></div>
                <div class="bar-chart__bar" style="height: 65%;"></div>
                <div class="bar-chart__bar bar-chart__bar--accent" style="height: 90%;"></div>
                <div class="bar-chart__bar" style="height: 55%;"></div>
                <div class="bar-chart__bar" style="height: 75%;"></div>
                <div class="bar-chart__bar bar-chart__bar--muted" style="height: 30%;"></div>
              </div>
            </div>
            <div class="ds-component-info">
              <div class="ds-component-name">Bar Chart</div>
              <div class="ds-component-class">.bar-chart</div>
            </div>
          </div>

          <!-- Sparkline -->
          <div class="ds-component-card">
            <div class="ds-component-preview" style="gap: 16px; flex-direction: column;">
              <div class="sparkline" style="width: 120px;">
                <div class="sparkline__bar" style="height: 40%;"></div>
                <div class="sparkline__bar sparkline__bar--high" style="height: 70%;"></div>
                <div class="sparkline__bar sparkline__bar--high" style="height: 55%;"></div>
                <div class="sparkline__bar" style="height: 85%;"></div>
                <div class="sparkline__bar sparkline__bar--high" style="height: 60%;"></div>
                <div class="sparkline__bar" style="height: 45%;"></div>
                <div class="sparkline__bar sparkline__bar--low" style="height: 30%;"></div>
                <div class="sparkline__bar" style="height: 50%;"></div>
                <div class="sparkline__bar sparkline__bar--high" style="height: 75%;"></div>
              </div>
            </div>
            <div class="ds-component-info">
              <div class="ds-component-name">Sparkline</div>
              <div class="ds-component-class">.sparkline</div>
            </div>
          </div>

          <!-- Mini Donut -->
          <div class="ds-component-card">
            <div class="ds-component-preview" style="gap: 24px;">
              <div class="mini-donut">
                <svg viewBox="0 0 48 48" width="48" height="48">
                  <circle class="mini-donut__track" cx="24" cy="24" r="20"/>
                  <circle class="mini-donut__fill" cx="24" cy="24" r="20" stroke-dasharray="125.6" stroke-dashoffset="31.4"/>
                </svg>
                <div class="mini-donut__value">75%</div>
              </div>
              <div class="mini-donut">
                <svg viewBox="0 0 48 48" width="48" height="48">
                  <circle class="mini-donut__track" cx="24" cy="24" r="20"/>
                  <circle class="mini-donut__fill" cx="24" cy="24" r="20" stroke-dasharray="125.6" stroke-dashoffset="87.9"/>
                </svg>
                <div class="mini-donut__value">30%</div>
              </div>
            </div>
            <div class="ds-component-info">
              <div class="ds-component-name">Mini Donut</div>
              <div class="ds-component-class">.mini-donut</div>
            </div>
          </div>

          <!-- Data Grid -->
          <div class="ds-component-card">
            <div class="ds-component-preview" style="width: 100%; padding: 16px;">
              <div class="data-grid data-grid--4" style="width: 100%;">
                <div class="data-grid__cell">
                  <div class="data-grid__cell-value">247</div>
                  <div class="data-grid__cell-label">Clips</div>
                </div>
                <div class="data-grid__cell">
                  <div class="data-grid__cell-value">12.4</div>
                  <div class="data-grid__cell-label">Hours</div>
                </div>
                <div class="data-grid__cell">
                  <div class="data-grid__cell-value">98%</div>
                  <div class="data-grid__cell-label">Done</div>
                </div>
                <div class="data-grid__cell">
                  <div class="data-grid__cell-value">4K</div>
                  <div class="data-grid__cell-label">Res</div>
                </div>
              </div>
            </div>
            <div class="ds-component-info">
              <div class="ds-component-name">Data Grid</div>
              <div class="ds-component-class">.data-grid</div>
            </div>
          </div>

        </div>
      </section>

      <!-- V06: VIDEO PRODUCTION -->
    </div>
  </main>
</body>
</html>
